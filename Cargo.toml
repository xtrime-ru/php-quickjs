[package]
name = "php_quickjs"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Embed a QuickJS sandbox in PHP with typed, bidirectional communication"
license = "MIT"
authors = ["Edd Mann <the@eddmann.com>"]
repository = "https://github.com/eddmann/php-quickjs"
homepage = "https://github.com/eddmann/php-quickjs"
readme = "README.md"
keywords = ["php", "quickjs", "javascript", "typescript", "sandbox"]
categories = ["api-bindings", "development-tools::ffi"]

[lib]
name = "php_quickjs"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = { version = "0.16.3", features = ["closure"] }
rquickjs = { version = "0.14.0", default-features = false, features = [
    "std",
    "macro",
    "classes",
    "array-buffer",
] }
serde_json = "1.0.154"

# TypeScript fast path: transpile guest TS -> JS in-process, remap errors.
oxc = { version = "0.155.0", features = ["full"] }
sourcemap = "9.3.2"
lru = "0.19.0"

[build-dependencies]
cc = "1.10.0"

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
