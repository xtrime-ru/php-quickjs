services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile-dev
    image: php-quickjs-dev:php85-rust196
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      CARGO_HOME: /workspace/.cache/cargo
      COMPOSER_CACHE_DIR: /workspace/.cache/composer
    entrypoint:
      - bash
      - -c
      - 'composer install --no-interaction --prefer-dist && exec "$$@"'
      - --
    command: [make, test]
